name: Generate contribution graphs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution-graph.svg?color_snake=#c2185b&color_dots=#ebedf0,#f8c8dc,#f48fb1,#ec407a,#ad1457
            dist/pacman-contribution-graph-dark.svg?palette=github-dark&color_snake=#f8c8dc&color_dots=#161b22,#5c1a33,#8e2453,#c2185b,#f06292

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
